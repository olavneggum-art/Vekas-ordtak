function isoWeek(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7)}
function thisWeeksBirthdays(n){const wd=n.getDay()||7,m=new Date(n);m.setDate(n.getDate()-wd+1);m.setHours(0,0,0,0);const su=new Date(m);su.setDate(m.getDate()+6);su.setHours(23,59,59,999);return birthdays.map(b=>{const date=[m.getFullYear(),su.getFullYear()].map(y=>new Date(y,b.month-1,b.day,12)).find(x=>x>=m&&x<=su);return {...b,date}}).filter(b=>b.date).sort((a,b)=>a.date-b.date)}
function update(){const n=new Date(),w=isoWeek(n);document.getElementById('date').textContent=n.toLocaleDateString('nn-NO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('week').textContent='Veke '+w;document.getElementById('localQuote').textContent='«'+localQuotes[(w-1)%localQuotes.length]+'»';const bs=thisWeeksBirthdays(n),bb=document.getElementById('birthdayContent');bb.innerHTML=bs.length?'<div class="birthday-list">'+bs.map(b=>`<div class="birthday-person"><div class="birthday-name">🎂 ${b.name}</div><div class="birthday-date">${b.date.toLocaleDateString('nn-NO',{weekday:'long',day:'numeric',month:'long'})}</div></div>`).join('')+'</div>':'<div class="birthday-note">Ingen bursdagar denne veka</div>';const qs=Array.from({length:4},(_,d)=>{const x=questionBank[((w-1)*4+d)%questionBank.length];return {day:['Måndag','Tysdag','Onsdag','Torsdag'][d],q:x[0],options:x[1],answer:x[2]}}),wd=n.getDay(),title=document.getElementById('quizTitle'),box=document.getElementById('quizContent');if(wd===5){title.textContent='Fredagsfasit';box.innerHTML='<div class="friday-grid">'+qs.map(x=>`<div class="friday-item"><div class="small">${x.day}</div><b>${x.q}</b><div class="correct">✓ ${x.answer}</div></div>`).join('')+'</div>'}else{const q=qs[(wd>=1&&wd<=4)?wd-1:0];title.textContent=q.day;box.innerHTML=`<div class="qbox"><div class="question">${q.q}</div><div class="answers">${q.options.map((o,i)=>`<div class="answer"><span class="letter">${String.fromCharCode(65+i)}</span>${o}</div>`).join('')}</div><div class="small" style="margin-top:14px">Fasit på fredag saman med svara frå måndag–torsdag.</div></div>`}}
function label(c){if(c===0)return['Klårvêr','☀️'];if([1,2].includes(c))return['Lett skya','🌤️'];if(c===3)return['Skya','☁️'];if([51,53,55,61,63,65,80,81,82].includes(c))return['Regn','🌧️'];if([71,73,75,77,85,86].includes(c))return['Snø','🌨️'];return['Vêr','🌤️']}
async function weather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=61.184374&longitude=6.849822&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=7');const d=await r.json(),l=label(d.current.weather_code);weatherIcon.textContent=l[1];weatherContent.innerHTML=`<div class="weather-row"><div><div class="temp">${Math.round(d.current.temperature_2m)}°</div><div>${l[0]}</div></div><div class="weather-details">Høg/låg: <b>${Math.round(d.daily.temperature_2m_max[0])}° / ${Math.round(d.daily.temperature_2m_min[0])}°</b><br>Kjennest som: <b>${Math.round(d.current.apparent_temperature)}°</b><br>Vind: <b>${Math.round(d.current.wind_speed_10m)} km/t</b></div></div>`;forecast.innerHTML=d.daily.time.slice(1).map((x,i)=>{const j=i+1,l2=label(d.daily.weather_code[j]);return `<div class="forecast-day"><div class="forecast-name">${new Date(x+'T12:00').toLocaleDateString('nn-NO',{weekday:'short'})}</div><div class="forecast-icon">${l2[1]}</div><div class="forecast-temp">${Math.round(d.daily.temperature_2m_max[j])}°/${Math.round(d.daily.temperature_2m_min[j])}°</div></div>`}).join('')}catch(e){weatherContent.textContent='Fekk ikkje henta vêrdata.'}}
update();weather();setInterval(update,60000);setInterval(weather,1800000);
