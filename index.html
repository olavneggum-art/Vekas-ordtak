<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infoskjerm</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:linear-gradient(135deg,#06101f,#101827 55%,#07352d)}
main{height:100vh;padding:20px;display:flex;flex-direction:column}.header{height:95px;display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #ffffff1a;padding-bottom:14px}.eyebrow{color:#6ee7b7;font-size:12px;font-weight:700;letter-spacing:.28em}.date{font-size:28px;font-weight:800;margin-top:8px;text-transform:capitalize}.week{background:#ffffff12;border-radius:30px;padding:11px 18px}.grid{flex:1;min-height:0;padding-top:16px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px}.card{border:1px solid #ffffff16;border-radius:26px;padding:23px;overflow:hidden}.weather{background:linear-gradient(135deg,#0ea5e933,#1e3a8a25)}.quiz{background:linear-gradient(135deg,#8b5cf626,#11182733)}.quote{background:linear-gradient(135deg,#10b98125,#11182733)}.info{background:#ffffff0c}.label{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}.pink{color:#fda4af}.blue{color:#bae6fd}.purple{color:#c4b5fd}.green{color:#6ee7b7}h2{font-size:25px;margin:5px 0 0}.weather-top{display:flex;justify-content:space-between}.place{color:#bae6fd;font-weight:700}.temp{font-size:65px;font-weight:800;margin-top:18px}.weather-row{display:flex;justify-content:space-between;align-items:end}.weather-details{text-align:right;line-height:1.7;color:#dbeafe}.small{font-size:12px;color:#94a3b8}.qbox{margin-top:24px;background:#ffffff0c;border-radius:18px;padding:24px}.question{font-size:25px;font-weight:700;line-height:1.25}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.answer{background:#ffffff12;border-radius:12px;padding:14px;text-align:center;font-weight:700}.letter{color:#c4b5fd;margin-right:6px}.quote-text{font-size:31px;font-weight:700;line-height:1.3;margin-top:35px}.friday-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.friday-item{background:#ffffff0c;padding:13px;border-radius:13px}.correct{color:#6ee7b7;font-weight:700;margin-top:6px}.birthday-note{font-size:23px;color:#cbd5e1;text-align:center;margin-top:60px}
</style>
</head><body><main>
<div class="header"><div><div class="eyebrow">INFOSKJERM</div><div id="date" class="date"></div></div><div id="week" class="week"></div></div>
<div class="grid">
<section class="card info"><div class="label pink">BURSDAGAR</div><h2>Denne veka</h2><div class="birthday-note">Ingen bursdagar registrert enno</div></section>
<section class="card weather"><div class="weather-top"><div><div class="place">📍 6863 Leikanger</div><h2>Vêret i dag</h2></div><div id="weatherIcon" style="font-size:46px">🌤️</div></div><div id="weatherContent" class="small" style="margin-top:35px;font-size:17px">Hentar vêrdata …</div><div class="small" style="margin-top:12px">Vêrdata: Open-Meteo · oppdaterast kvar 30. minutt</div></section>
<section class="card quiz"><div class="label purple">DAGENS QUIZ</div><h2 id="quizTitle"></h2><div id="quizContent"></div></section>
<section class="card quote"><div class="label green">VEKAS ORDTAK</div><div id="quote" class="quote-text"></div></section>
</div></main>
<script>
const quotes=["Det er dei små tinga som skaper dei gode dagane.","Ein god kollega kan gjere ein heilt vanleg dag litt betre.","Små steg kvar dag blir til store resultat over tid.","Det du gir merksemd, får plass til å vekse.","Eit smil og eit godt ord kostar lite, men kan bety mykje.","Saman får vi til meir enn vi gjer kvar for oss.","Ein god arbeidsdag startar ofte med at vi ser kvarandre.","Gjer litt meir av det som gir energi.","Framgang treng ikkje gå fort, berre framover.","Ta vare på dei gode augneblikka i kvardagen.","Det er lov å vere stolt av det ein får til.","Gode dagar blir endå betre når dei blir delte."];
const quizzes=[
{day:"Måndag",q:"Kva land har Lisboa som hovudstad?",options:["Portugal","Spania","Italia"],answer:"Portugal"},
{day:"Tysdag",q:"Kva er 9 × 8?",options:["64","72","81"],answer:"72"},
{day:"Onsdag",q:"Kva dyr er verdas største?",options:["Afrikansk elefant","Blåkval","Kvit hai"],answer:"Blåkval"},
{day:"Torsdag",q:"Kva planet ligg nærast sola?",options:["Venus","Merkur","Mars"],answer:"Merkur"}];
function isoWeek(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7)}
function updateStatic(){const n=new Date(),w=isoWeek(n);document.getElementById('date').textContent=n.toLocaleDateString('nn-NO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.getElementById('week').textContent='Veke '+w;document.getElementById('quote').textContent='«'+quotes[(w-1)%quotes.length]+'»';const wd=n.getDay(), title=document.getElementById('quizTitle'), box=document.getElementById('quizContent');if(wd===5){title.textContent='Fredagsfasit';box.innerHTML='<div class="friday-grid">'+quizzes.map(x=>`<div class="friday-item"><div class="small">${x.day}</div><b>${x.q}</b><div class="correct">✓ ${x.answer}</div></div>`).join('')+'</div>'}else{const ix=(wd>=1&&wd<=4)?wd-1:0,q=quizzes[ix];title.textContent=q.day;box.innerHTML=`<div class="qbox"><div class="question">${q.q}</div><div class="answers">${q.options.map((o,i)=>`<div class="answer"><span class="letter">${String.fromCharCode(65+i)}</span>${o}</div>`).join('')}</div><div class="small" style="margin-top:17px">Fasit på fredag saman med svara frå måndag–torsdag.</div></div>`}}
function label(c){if(c===0)return['Klårvêr','☀️'];if([1,2].includes(c))return['Lett skya','🌤️'];if(c===3)return['Skya','☁️'];if([45,48].includes(c))return['Tåke','🌫️'];if([51,53,55,61,63,65,80,81,82].includes(c))return['Regn','🌧️'];if([71,73,75,77,85,86].includes(c))return['Snø','🌨️'];if([95,96,99].includes(c))return['Torevêr','⛈️'];return['Vêr','🌤️']}
async function weather(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=61.184374&longitude=6.849822&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1';const r=await fetch(u);if(!r.ok)throw 0;const d=await r.json(),l=label(d.current.weather_code);document.getElementById('weatherIcon').textContent=l[1];document.getElementById('weatherContent').innerHTML=`<div class="weather-row"><div><div class="temp">${Math.round(d.current.temperature_2m)}°</div><div style="font-size:20px;color:#dbeafe">${l[0]}</div></div><div class="weather-details">Høg/låg: <b>${Math.round(d.daily.temperature_2m_max[0])}° / ${Math.round(d.daily.temperature_2m_min[0])}°</b><br>Kjennest som: <b>${Math.round(d.current.apparent_temperature)}°</b><br>Vind: <b>${Math.round(d.current.wind_speed_10m)} km/t</b></div></div>`}catch(e){document.getElementById('weatherContent').textContent='Fekk ikkje henta vêrdata. Prøv den publiserte GitHub Pages-sida.'}}
updateStatic();weather();setInterval(updateStatic,60000);setInterval(weather,1800000);
</script></body></html>
