<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vekas ordtak</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#07151a}.screen{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:6vh 7vw;background:radial-gradient(circle at 20% 20%,rgba(52,211,153,.22),transparent 30%),radial-gradient(circle at 80% 75%,rgba(56,189,248,.13),transparent 28%),linear-gradient(135deg,#071018,#101827 55%,#06261f)}.content{max-width:1300px}.label{color:#6ee7b7;font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:clamp(22px,2vw,34px);margin-bottom:7vh}.quote{font-size:clamp(48px,6vw,94px);font-weight:700;line-height:1.15;letter-spacing:-.025em;margin:0}.line{width:115px;height:2px;background:rgba(52,211,153,.65);margin:7vh auto 4vh}.week{color:#94a3b8;font-size:clamp(20px,2vw,30px)}
</style>
</head>
<body>
<main class="screen"><section class="content"><div class="label">Vekas ordtak</div><blockquote id="quote" class="quote"></blockquote><div class="line"></div><div id="week" class="week"></div></section></main>
<script>
const quotes=[
"Det er dei små tinga som skaper dei gode dagane.",
"Ein god kollega kan gjere ein heilt vanleg dag litt betre.",
"Små steg kvar dag blir til store resultat over tid.",
"Det du gir merksemd, får plass til å vekse.",
"Eit smil og eit godt ord kostar lite, men kan bety mykje.",
"Saman får vi til meir enn vi gjer kvar for oss.",
"Ein god arbeidsdag startar ofte med at vi ser kvarandre.",
"Gjer litt meir av det som gir energi.",
"Framgang treng ikkje gå fort, berre framover.",
"Ta vare på dei gode augneblikka i kvardagen.",
"Det er lov å vere stolt av det ein får til.",
"Gode dagar blir endå betre når dei blir delte."
];
function isoWeek(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-ys)/86400000)+1)/7)}
function update(){const w=isoWeek(new Date());document.getElementById('quote').textContent='«'+quotes[(w-1)%quotes.length]+'»';document.getElementById('week').textContent='Veke '+w}
update();setInterval(update,60000);
</script>
</body>
</html>
